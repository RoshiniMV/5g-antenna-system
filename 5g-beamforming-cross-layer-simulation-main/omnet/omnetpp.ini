[General]
network = roshini.Full5GSystem
sim-time-limit = 1000s

*.gnb.numAntennas = 64
*.gnb.txPower = 40
*.scheduler.resourceBlocks = 200

*.ue[*].mobility = true
*.ue[*].speed = uniform(5,25)

*.phy.frequency = 28GHz
*.phy.modulation = 256

*.mac.delay = 1ms
*.mac.queueSize = 1000

*.mobility.speed = uniform(5,20)
